<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesa RPG Digital</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#e94560">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa RPG">
<link rel="apple-touch-icon" href="/static/img/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 16px;
    padding: 48px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  .logo { font-size: 3rem; margin-bottom: 8px; }
  h1 { font-size: 1.8rem; color: #e94560; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 36px; }
  .section { margin-bottom: 24px; }
  label { display: block; text-align: left; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    background: #0f3460;
    border: 1px solid #1a4a8a;
    border-radius: 8px;
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type=text]:focus { border-color: #e94560; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #c73652; }
  .btn-secondary { background: #0f3460; color: #e0e0e0; border: 1px solid #1a4a8a; }
  .btn-secondary:hover { background: #1a4a8a; }
  .divider { border: none; border-top: 1px solid #0f3460; margin: 28px 0; }
  .join-section label { margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { flex: 0 0 auto; padding: 12px 18px; }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px;
    margin: 12px 0; text-align: left;
  }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #e94560; }
  .checkbox-row label { margin: 0; color: #ccc; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">🎲</div>
  <h1>Mesa RPG Digital</h1>
  <p class="subtitle">Crie ou entre em uma sala para jogar</p>

  <div class="section">
    <label>Seu nome</label>
    <input type="text" id="player-name" placeholder="Como você quer ser chamado?" maxlength="32">
  </div>

  <div class="section">
    <div class="checkbox-row">
      <input type="checkbox" id="is-gm" onchange="toggleGMFields()">
      <label for="is-gm">Sou o Mestre (GM) — tenho controle total da mesa</label>
    </div>
  </div>

  <div class="section" id="gm-room-section" style="display:none">
    <label>Nome da sala <span style="color:#888;font-size:0.8em">(será a senha para os jogadores entrarem)</span></label>
    <input type="text" id="room-name-create" placeholder="Ex: Mesa do Vitin, Campanha01..." maxlength="32">
  </div>

  <button class="btn btn-primary" id="btn-create" style="display:none" onclick="createRoom()">✦ Criar Sala</button>

  <hr class="divider">

  <div class="join-section">
    <label>Entrar em sala existente</label>
    <input type="text" id="room-code" placeholder="Nome / senha da sala" maxlength="64" style="text-transform:uppercase;margin-bottom:10px">
    <button class="btn btn-secondary" style="margin:0" onclick="joinRoom()">Entrar</button>
  </div>
</div>

<script>
  document.getElementById('room-code').addEventListener('input', function() {
    this.value = this.value.toUpperCase();
  });
  document.getElementById('room-name-create').addEventListener('input', function() {
    this.value = this.value.toUpperCase();
  });

  // Restaurar dados da última sessão
  window.addEventListener('load', () => {
    const savedName = localStorage.getItem('rpg_last_name');
    const savedRoom = localStorage.getItem('rpg_last_room');
    const savedIsGM = localStorage.getItem('rpg_last_is_gm') === '1';
    if (savedName) document.getElementById('player-name').value = savedName;
    if (savedRoom) document.getElementById('room-code').value = savedRoom;
    if (savedIsGM) {
      document.getElementById('is-gm').checked = true;
      if (savedRoom) document.getElementById('room-name-create').value = savedRoom;
      toggleGMFields();
    }
  });

  function toggleGMFields() {
    const isGM = document.getElementById('is-gm').checked;
    document.getElementById('gm-room-section').style.display = isGM ? '' : 'none';
    document.getElementById('btn-create').style.display = isGM ? '' : 'none';
  }

  function normalizeRoomId(raw) {
    return raw.trim().toUpperCase().replace(/\s+/g, '-').replace(/[^A-Z0-9\-]/g, '');
  }

  function createRoom() {
    const name = document.getElementById('player-name').value.trim();
    if (!name) { alert('Digite seu nome!'); return; }
    const rawRoom = document.getElementById('room-name-create').value.trim();
    if (!rawRoom) { alert('Digite o nome da sala!'); return; }
    const roomId = normalizeRoomId(rawRoom);
    if (roomId.length < 2) { alert('Nome de sala inválido. Use letras e números.'); return; }
    localStorage.setItem('rpg_last_name', name);
    localStorage.setItem('rpg_last_room', rawRoom);
    localStorage.setItem('rpg_last_is_gm', '1');
    sessionStorage.setItem('player_name', name);
    sessionStorage.setItem('is_gm', '1');
    window.location.href = `/room/${roomId}`;
  }

  function joinRoom() {
    const name = document.getElementById('player-name').value.trim();
    const raw = document.getElementById('room-code').value.trim();
    if (!name) { alert('Digite seu nome!'); return; }
    if (!raw || raw.length < 2) { alert('Digite o nome/senha da sala!'); return; }
    const roomId = normalizeRoomId(raw);
    const isGMCheck = document.getElementById('is-gm').checked;
    localStorage.setItem('rpg_last_name', name);
    localStorage.setItem('rpg_last_room', raw);
    localStorage.setItem('rpg_last_is_gm', isGMCheck ? '1' : '0');
    sessionStorage.setItem('player_name', name);
    sessionStorage.setItem('is_gm', isGMCheck ? '1' : '0');
    window.location.href = `/room/${roomId}`;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const isGM = document.getElementById('is-gm').checked;
      if (isGM) createRoom(); else joinRoom();
    }
  });
</script>
</body>
</html>
